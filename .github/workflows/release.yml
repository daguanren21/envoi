name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: http
        type: choice
        options:
          - http
          - plugins
      version:
        description: "Exact package semver, for example 0.1.0 or 1.0.0-rc.1"
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

concurrency:
  group: release-${{ inputs.package }}-${{ inputs.version }}
  cancel-in-progress: false

# npm Trusted Publishing must match:
# owner=daguanren21 repo=envoi workflow=release.yml environment=<empty>
permissions: {}

jobs:
  release:
    name: Version, verify, pack, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
      PACKAGE_NAME: "@envoijs/${{ inputs.package }}"
      PACKAGE_DIR: "packages/${{ inputs.package }}"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: npm install --global npm@11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Validate exact semver input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            const version = process.env.RELEASE_VERSION
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
            if (!semver.test(version)) {
              console.error(`Invalid exact semver: ${version}`)
              process.exit(1)
            }
          '
          if [ "$RELEASE_PACKAGE" = "http" ]; then
            echo "PACKAGE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_TAG=$RELEASE_PACKAGE-v$RELEASE_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Set package version with pnpm
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pnpm --dir "$PACKAGE_DIR" version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          pnpm install --lockfile-only

      - run: pnpm verify

      - name: Check whether npm version already exists
        id: registry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack with pnpm
        if: steps.registry.outputs.published != 'true'
        run: |
          rm -rf release
          mkdir release
          pnpm --dir "$PACKAGE_DIR" pack --pack-destination ../../release

      # pnpm 11 publish is native and does not perform npm's OIDC exchange.
      # npm CLI uploads the pnpm-generated tarball using Trusted Publishing.
      - name: Publish tarball with npm OIDC
        if: steps.registry.outputs.published != 'true'
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: npm publish ./release/*.tgz --tag "$NPM_TAG" --access public --provenance

      - name: Verify npm publication
        if: steps.registry.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in {1..12}; do
            published="$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version 2>/dev/null || true)"
            if [ "$published" = "$RELEASE_VERSION" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "npm did not expose $PACKAGE_NAME@$RELEASE_VERSION after publish" >&2
          exit 1

      - name: Commit version and push tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_DIR/package.json" pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $PACKAGE_NAME@$RELEASE_VERSION"
            git push origin HEAD:main
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$PACKAGE_TAG" >/dev/null 2>&1; then
            git tag "$PACKAGE_TAG"
            git push origin "$PACKAGE_TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release view "$PACKAGE_TAG" >/dev/null 2>&1 || \
            gh release create "$PACKAGE_TAG" --title "$PACKAGE_NAME@$RELEASE_VERSION" --generate-notes
